<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="theme-color"
        content="#20252b"
    >

    <title>CodEsp — Entorno de desarrollo</title>

    <link
        rel="stylesheet"
        href="css/core.css"
    >

    <link
        rel="stylesheet"
        href="css/editor.css"
    >

    <link
        rel="stylesheet"
        href="css/plugins.css"
    >
</head>

<body>

<div id="app">

    <header class="top">

        <div class="brand">
            <span class="brand-mark">CE</span>

            <span class="brand-name">
                CodEsp
            </span>

            <small>
                ENTORNO 0.3
            </small>
        </div>


        <nav id="main-nav">

            <button
                data-view="editor"
                class="active"
            >
                Editor
            </button>

            <button
                data-view="plugins"
            >
                Plugins
            </button>

            <button
                data-view="archivos"
            >
                Archivos
            </button>

            <button
                data-view="ayuda"
            >
                Ayuda
            </button>

        </nav>


        <div class="top-actions">

            <button
                id="runTop"
                class="primary"
            >
                ▶ Ejecutar
            </button>

            <button
                id="menuBtn"
                class="icon-btn"
                aria-label="Abrir menú"
                type="button"
            >
                ☰
            </button>

        </div>

    </header>


    <!--
        Aquí se cargan dinámicamente:
        editor.html
        plugins.html
        archivos.html
        ayuda.html
    -->

    <main id="workspace">
        <div class="boot-screen">
            <div class="boot-logo">CE</div>
            <strong>CodEsp</strong>
            <span>Inicializando entorno...</span>
        </div>
    </main>

</div>


<input
    id="filePicker"
    type="file"
    accept=".codesp,text/plain"
    hidden
>

<input
    id="projectPicker"
    type="file"
    accept=".codesp,text/plain"
    multiple
    hidden
>


<!--
    El parámetro ?v evita que el navegador
    se quede usando una versión antigua.
-->
<script
    type="module"
    src="js/app.js?v=0.3.1"
></script>

</body>
</html>
