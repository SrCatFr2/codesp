<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#eaf8ff">

    <title>CodEsp IDE</title>

    <link rel="stylesheet" href="./css/core.css">
    <link rel="stylesheet" href="./css/editor.css">
    <link rel="stylesheet" href="./css/plugins.css">

    <script>
        (() => {
            const theme = localStorage.getItem("codesp_theme");

            if (theme === "dark") {
                document.documentElement.dataset.theme = "dark";
            }
        })();
    </script>
</head>

<body>

<div id="app">

    <!-- ========================================= -->
    <!-- HEADER -->
    <!-- ========================================= -->

    <header class="top">

        <div class="brand">

            <div class="brand-orb">
                <span>&lt;/&gt;</span>
            </div>

            <div class="brand-text">
                <strong>CodEsp</strong>
                <span>Lenguaje técnico en español</span>
            </div>

        </div>

        <nav id="mainNav">

            <button
                class="nav-btn active"
                data-view="editor"
            >
                <span>⌘</span>
                Editor
            </button>

            <button
                class="nav-btn"
                data-view="plugins"
            >
                <span>◇</span>
                Plugins
            </button>

            <button
                class="nav-btn"
                data-view="archivos"
            >
                <span>▱</span>
                Archivos
            </button>

            <button
                class="nav-btn"
                data-view="ayuda"
            >
                <span>?</span>
                Ayuda
            </button>

        </nav>

        <div class="top-actions">

            <button
                id="runTop"
                class="top-run"
                title="Ejecutar código"
            >
                <span>▶</span>
                Ejecutar
            </button>

            <button
                id="themeToggle"
                class="icon-button"
                title="Cambiar tema"
            >
                ◐
            </button>

            <button
                id="mobileMenu"
                class="icon-button mobile-only"
                title="Menú"
            >
                ☰
            </button>

        </div>

    </header>


    <!-- ========================================= -->
    <!-- WORKSPACE -->
    <!-- ========================================= -->

    <main id="workspace">

        <div class="boot-screen">

            <div class="boot-orb">
                &lt;/&gt;
            </div>

            <h1>Cargando CodEsp</h1>

            <p>
                Preparando el entorno de desarrollo...
            </p>

            <div class="boot-loader">
                <span></span>
            </div>

        </div>

    </main>


    <!-- ========================================= -->
    <!-- FILE INPUTS -->
    <!-- ========================================= -->

    <input
        type="file"
        id="filePicker"
        accept=".codesp,.txt"
        hidden
    >

    <input
        type="file"
        id="projectPicker"
        accept=".json"
        hidden
    >


    <!-- ========================================= -->
    <!-- TOASTS -->
    <!-- ========================================= -->

    <div id="toastContainer"></div>

</div>


<!-- ============================================= -->
<!-- GLOBAL NAVIGATION -->
<!-- ============================================= -->

<script>
(() => {

    const workspace = document.getElementById("workspace");
    const nav = document.getElementById("mainNav");

    let currentView = "editor";


    async function loadView(viewName, updateHash = true) {

        if (!workspace) return;

        const allowed = [
            "editor",
            "plugins",
            "archivos",
            "ayuda"
        ];

        if (!allowed.includes(viewName)) {
            viewName = "editor";
        }

        currentView = viewName;

        if (updateHash) {
            history.replaceState(
                null,
                "",
                "#" + viewName
            );
        }

        nav?.querySelectorAll(".nav-btn").forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.view === viewName
            );

        });

        workspace.classList.add("view-changing");

        try {

            const response = await fetch(
                `./views/${viewName}.html?v=0.4.0`
            );

            if (!response.ok) {
                throw new Error(
                    `No se pudo cargar views/${viewName}.html`
                );
            }

            const html = await response.text();

            workspace.innerHTML = html;

            requestAnimationFrame(() => {

                workspace.classList.remove(
                    "view-changing"
                );

                workspace.classList.add(
                    "view-visible"
                );

                setTimeout(() => {
                    workspace.classList.remove(
                        "view-visible"
                    );
                }, 350);

            });

            document.dispatchEvent(
                new CustomEvent(
                    "codesp:view-loaded",
                    {
                        detail: {
                            view: viewName
                        }
                    }
                )
            );

        } catch (error) {

            workspace.classList.remove(
                "view-changing"
            );

            workspace.innerHTML = `
                <section class="error-page">

                    <div class="error-icon">!</div>

                    <h1>No se pudo cargar la vista</h1>

                    <p>
                        ${escapeHtml(error.message)}
                    </p>

                    <button
                        class="primary"
                        id="retryView"
                    >
                        Reintentar
                    </button>

                </section>
            `;

            document
                .getElementById("retryView")
                ?.addEventListener(
                    "click",
                    () => loadView(viewName)
                );
        }

        nav?.classList.remove("mobile-open");
    }


    function escapeHtml(value) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    nav?.addEventListener("click", event => {

        const button =
            event.target.closest(".nav-btn");

        if (!button) return;

        loadView(button.dataset.view);

    });


    window.addEventListener("hashchange", () => {

        const view =
            location.hash.replace("#", "");

        loadView(view || "editor", false);

    });


    document
        .getElementById("mobileMenu")
        ?.addEventListener("click", () => {

            nav?.classList.toggle(
                "mobile-open"
            );

        });


    document
        .getElementById("themeToggle")
        ?.addEventListener("click", () => {

            const dark =
                document.documentElement.dataset.theme === "dark";

            if (dark) {

                delete document.documentElement.dataset.theme;

                document.body.classList.remove(
                    "dark-mode"
                );

                localStorage.removeItem(
                    "codesp_theme"
                );

            } else {

                document.documentElement.dataset.theme =
                    "dark";

                document.body.classList.add(
                    "dark-mode"
                );

                localStorage.setItem(
                    "codesp_theme",
                    "dark"
                );

            }

        });


    const initialView =
        location.hash.replace("#", "") || "editor";

    loadView(initialView, false);

})();
</script>


<script type="module" src="./js/app.js?v=0.4.0"></script>

</body>
</html>
